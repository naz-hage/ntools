name: Release Retention

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily at 3 AM
  workflow_dispatch:       # allow manual run

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old releases
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 10; // number of releases to keep
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const old = releases.data.slice(keep);

            for (const rel of old) {
              console.log(`Deleting release: ${rel.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.id
              });

              // delete the tag too
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${rel.tag_name}`
              });
            }

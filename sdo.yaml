version: "1.0"
description: "Build the ntools stage"
variables:
  ArtifactDirectory: "C:\\Artifacts"
  Target: "Release"
execution:
    verbose: true
steps:
  - name: clean solution
    path: sdo
    arguments: "clean"
    workingDirectory: .
    expectedReturnCode: 0
  - name: dotnet-version
    path: dotnet
    arguments: "--version"
    workingDirectory: .
    expectedReturnCode: 0
  - name: get repo info
    path: sdo
    arguments: "repo info"
    workingDirectory: .
    expectedReturnCode: 0    
  # AUTOTAG_STAGE;
  - name: autotag stage
    path: sdo
    arguments: "repo tag auto -b stage --verbose --dry-run"
    workingDirectory: .
    expectedReturnCode: 0
  # Version=$(Get-Content .\.temp\.tag) /v:m
  - name: get version
    path:  pwsh.exe
    arguments: '-Command Get-Content .\.temp\.tag'
    workingDirectory: .
    expectedReturnCode: 0
  # SOLUTION;
  - name: build solution
    path: sdo
    arguments: "solution"
    workingDirectory: .
    expectedReturnCode: 0
  # TEST;
  # - name: test solution
  #   path: sdo
  #   arguments: "test"
  #   workingDirectory: .
  #   expectedReturnCode: 0
  # COPY_ARTIFACTS;
  # PUBLISH;
  - name: publish sdo
    path: pwsh.exe
    arguments: >-
      -NoProfile -Command
      "$version = (Get-Content '.\\.temp\\.tag').Trim();
      $output = Join-Path '$(ArtifactDirectory)' ('ntools\\$(Target)\\' + $version);
      dotnet publish '.\\Sdo\\Sdo.csproj' -c '$(Target)' -o $output --no-restore /p:SolutionVersion=$version"
    workingDirectory: .
    expectedReturnCode: 0
version: "1.0"
description: "special build and test steps for ntools"
variables:
  Configuration: "Release"
execution:
  verbose: true
  timeout: 60
steps:
  - name: build-ntools-launcher
    path: sdo
    arguments: "nuget_add"
    workingDirectory: "c:\\source\\ntools-launcher"
    expectedReturnCode: 0
  - name: build-ntools
    path: sdo
    arguments: "solution"
    workingDirectory: "c:\\source\\ntools"
    expectedReturnCode: 0
  - name: e2e-test
    path: sdo.exe
    arguments: e2e --metadata-path c:\\source\\ntools\\dev-setup\\test
    workingDirectory: "c:\\source\\ntools\\sdo\\bin\\release"
    expectedReturnCode: 0